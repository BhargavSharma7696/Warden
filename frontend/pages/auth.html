<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warden · Log in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
      </span>
      <span>
        <span class="brand-name">Warden</span><br>
        <span class="brand-sub">Hostel management</span>
      </span>
    </a>
  </header>

  <main class="page">
    <section class="card">
      <div class="card-head">
        <h1 id="form-title">Log in</h1>
        <p id="form-sub">Use your Student ID and password to continue.</p>
      </div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-id">Student ID</label>
          <input id="login-id" name="studentId" type="text" autocomplete="username" placeholder="e.g. B25CS030" data-rule="required">
          <small class="error"></small>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <div class="pw-wrap">
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" data-rule="required">
            <button type="button" class="toggle-pw" data-target="login-password">Show</button>
          </div>
          <small class="error"></small>
        </div>

        <button type="submit" class="btn">Log in</button>
        <p class="switch-text">New here? <a href="#signup" data-mode="signup">Create an account</a></p>

      </form>
    </section>
  </main>

  <footer class="footer">Warden · Hostel Management</footer>

</body>
</html>
