<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise Announcement</title>
    <link rel="stylesheet" href="../styles/raiseissue.css">
    <link rel="stylesheet" href="../styles/common.css">
    <script src="../script/raiseannouncement.js" defer></script>
</head>
<body>
    <nav class="nav">
        <div class="iconName">
            <img src="../cnt/icon.png" width="40px" height="40px">
            <div class="appNameBox">
                <p class="appName">
                    <a href="dashboard.html">
                         Warden
                    </a>
                </p>
                <p class="appDesc">
                    Hostel Management
                </p>
            </div> 
        </div>

        <div class="navArea">
            <div class="currIssuesField">
                <span class="fieldText listIssueText">
                    <a href="listissue.html">
                        Current Issues
                    </a>
                </span>
            </div>
            <div class="announcementsField">
                <span class="fieldText announcementText">
                    <a href="announcement.html">
                         Announcements
                    </a>
                </span>
            </div>
            <a href="auth.html" class="logoutBtn" title="Log out" aria-label="Log out" onclick="localStorage.removeItem('token')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </a> 
        </div>
    </nav>

    <section class="issueCard">
        <section class="headingIssue">
            <div class="headingIcon">RA</div>
            <div class="headingText">
                <h1>Raise Announcement</h1>
                <p>Share updates, notices, or events with everyone.</p>
            </div>
        </section>

        <div class="notice">
            <span class="infoIcon">i</span>
            <p>All fields marked with * are required.</p>
        </div>

        <form id="raiseAnnouncementForm">
            <div class="formGrid">
                <div class="formGroup">
                    <label for="title">Title *</label>
                    <input type="text" id="title" name="title" placeholder="Enter announcement title" required>
                </div>

                <div class="formGroup">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="Electricity">Electricity</option>
                        <option value="Laundry">Laundry</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="General">General</option>
                    </select>
                </div>

                <div class="formGroup">
                    <label for="hostel">Hostel *</label>
                    <select id="hostel" name="hostel" required>
                        <option value="">Select Hostel</option>
                        <option value="All Hostels">All Hostels</option>
                        <option value="Gopad">Gopad</option>
                        <option value="Kanhar">Kanhar</option>
                        <option value="Indiravati">Indiravati</option>
                        <option value="Shivnath">Shivnath</option>
                    </select>
                </div>

                <div class="formGroup">
                    <label for="team">Team *</label>
                    <input type="text" id="team" name="team" placeholder="Team responsible" required>
                </div>

                <div class="formGroup fullWidth">
                    <label for="body">Body *</label>
                    <textarea id="body" name="body" rows="15" placeholder="Write the announcement details here..." required></textarea>
                </div>
            </div>

            <button type="submit" class="submitButton">Submit</button>
        </form>
    </section>
</body>
</html>
